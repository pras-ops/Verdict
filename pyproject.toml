[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.1.0"
description = "Turn any LLM into a calibrated decision engine: choices, yes/no and scores from token probabilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
hf = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
verdict = "verdict.cli:main"

[tool.setuptools.packages.find]
include = ["verdict*"]

[tool.setuptools.package-data]
verdict = ["dashboard/*"]
